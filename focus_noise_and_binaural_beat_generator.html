<div style="padding: 0.5rem 0;">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">An audio generator producing brown, pink, or white noise plus an optional binaural beat, with controls for volume and beat frequency.</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.25rem;">
    <button id="b-brown" style="text-align:left;">Brown noise</button>
    <button id="b-pink" style="text-align:left;">Pink noise</button>
    <button id="b-white" style="text-align:left;">White noise</button>
  </div>

  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;margin-bottom:1.25rem;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;">
      <label for="vol" style="font-size:14px;color:var(--text-secondary);min-width:74px;">Noise level</label>
      <input type="range" id="vol" min="0" max="100" step="1" value="35" style="flex:1;" />
      <span id="vol-out" style="font-size:14px;font-weight:500;min-width:36px;text-align:right;">35%</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;">
      <label for="beat" style="font-size:14px;color:var(--text-secondary);min-width:74px;">Beat rate</label>
      <input type="range" id="beat" min="0" max="30" step="1" value="16" style="flex:1;" />
      <span id="beat-out" style="font-size:14px;font-weight:500;min-width:36px;text-align:right;">16 Hz</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <label for="tone" style="font-size:14px;color:var(--text-secondary);min-width:74px;">Tone level</label>
      <input type="range" id="tone" min="0" max="100" step="1" value="12" style="flex:1;" />
      <span id="tone-out" style="font-size:14px;font-weight:500;min-width:36px;text-align:right;">12%</span>
    </div>
    <p id="hint" style="font-size:13px;color:var(--text-muted);margin:12px 0 0;line-height:1.5;">Beat rate needs headphones — it works by sending slightly different pitches to each ear. Set tone level to 0 for pure noise.</p>
  </div>

  <div style="display:flex;align-items:center;gap:12px;">
    <button id="toggle" style="min-width:120px;"><i class="ti ti-player-play" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px;"></i>Start</button>
    <span id="status" style="font-size:14px;color:var(--text-secondary);">Stopped</span>
  </div>
</div>

<script>
(function(){
  var ctx=null,noiseSrc=null,noiseGain=null,oscL=null,oscR=null,toneGain=null,running=false,kind='brown';
  var vol=document.getElementById('vol'),beat=document.getElementById('beat'),tone=document.getElementById('tone');
  var volOut=document.getElementById('vol-out'),beatOut=document.getElementById('beat-out'),toneOut=document.getElementById('tone-out');
  var toggle=document.getElementById('toggle'),status=document.getElementById('status');
  var carrier=180;

  function mark(){
    ['brown','pink','white'].forEach(function(k){
      var el=document.getElementById('b-'+k);
      el.style.borderColor = (k===kind)?'var(--border-accent)':'var(--border-strong)';
      el.style.color = (k===kind)?'var(--text-accent)':'var(--text-primary)';
    });
  }

  function buildBuffer(c){
    var len=c.sampleRate*4,buf=c.createBuffer(2,len,c.sampleRate);
    for(var ch=0;ch<2;ch++){
      var d=buf.getChannelData(ch),last=0,b0=0,b1=0,b2=0;
      for(var i=0;i<len;i++){
        var w=Math.random()*2-1;
        if(kind==='white'){d[i]=w*0.5;}
        else if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.2;}
        else{b0=0.99765*b0+w*0.0990460;b1=0.96300*b1+w*0.2965164;b2=0.57000*b2+w*1.0526913;d[i]=(b0+b1+b2+w*0.1848)*0.22;}
      }
    }
    return buf;
  }

  function start(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    noiseGain=ctx.createGain();noiseGain.gain.value=0;noiseGain.connect(ctx.destination);
    noiseSrc=ctx.createBufferSource();noiseSrc.buffer=buildBuffer(ctx);noiseSrc.loop=true;
    noiseSrc.connect(noiseGain);noiseSrc.start();
    var merger=ctx.createChannelMerger(2);
    toneGain=ctx.createGain();toneGain.gain.value=0;
    oscL=ctx.createOscillator();oscR=ctx.createOscillator();
    oscL.type='sine';oscR.type='sine';
    oscL.frequency.value=carrier;oscR.frequency.value=carrier+Number(beat.value);
    oscL.connect(merger,0,0);oscR.connect(merger,0,1);
    merger.connect(toneGain);toneGain.connect(ctx.destination);
    oscL.start();oscR.start();
    running=true;apply(true);
    toggle.innerHTML='<i class="ti ti-player-pause" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px;"></i>Stop';
    status.textContent='Playing '+kind+' noise';
  }

  function stop(){
    if(!ctx)return;
    var t=ctx.currentTime;
    noiseGain.gain.linearRampToValueAtTime(0,t+0.3);
    toneGain.gain.linearRampToValueAtTime(0,t+0.3);
    setTimeout(function(){ if(ctx){ctx.close();ctx=null;} },400);
    running=false;
    toggle.innerHTML='<i class="ti ti-player-play" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px;"></i>Start';
    status.textContent='Stopped';
  }

  function apply(ramp){
    if(!ctx||!running)return;
    var t=ctx.currentTime,d=ramp?0.4:0.08;
    noiseGain.gain.linearRampToValueAtTime(Math.pow(Number(vol.value)/100,2)*0.9,t+d);
    toneGain.gain.linearRampToValueAtTime(Math.pow(Number(tone.value)/100,2)*0.5,t+d);
    oscR.frequency.linearRampToValueAtTime(carrier+Number(beat.value),t+d);
  }

  vol.addEventListener('input',function(){volOut.textContent=Math.round(vol.value)+'%';apply(false);});
  tone.addEventListener('input',function(){toneOut.textContent=Math.round(tone.value)+'%';apply(false);});
  beat.addEventListener('input',function(){beatOut.textContent=Math.round(beat.value)+' Hz';apply(false);});

  ['brown','pink','white'].forEach(function(k){
    document.getElementById('b-'+k).addEventListener('click',function(){
      kind=k;mark();
      if(running){var was=running;stop();setTimeout(start,450);}
    });
  });

  toggle.addEventListener('click',function(){ running?stop():start(); });
  mark();
})();
</script>
